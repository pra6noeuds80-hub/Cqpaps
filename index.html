<header><h1>🛡️ CQP APS – Agent de prévention et de sécurité</h1><p>Cours et QCM d'entraînement</p></header>
<nav id="nav"></nav>
<main id="app"></main>
<script>
const M=[
{t:"Cadre juridique et déontologie",c:`<h3>Le cadre légal</h3><ul><li>Les activités privées de sécurité sont encadrées par le <b>Code de la sécurité intérieure (CSI), Livre VI</b>.</li><li>Pour exercer, il faut une <b>carte professionnelle</b> délivrée par le <b>CNAPS</b>, valable <b>5 ans</b>, renouvelable (formation continue).</li><li>Le CNAPS contrôle les agents et peut sanctionner (avertissement, blâme, pénalité financière, interdiction temporaire d'exercer).</li></ul><h3>Déontologie</h3><ul><li>Respect de la loi, de la dignité des personnes, de leur vie privée.</li><li>Neutralité : aucune discrimination.</li><li>Discrétion professionnelle sur les informations obtenues.</li><li>Interdiction de se faire passer pour un policier ou un gendarme (tenue, véhicule, vocabulaire).</li></ul><div class="key">L'agent privé n'a <b>pas de pouvoirs de police</b> : il dispose des droits de tout citoyen, plus quelques prérogatives précises prévues par la loi.</div>`,
q:[["Quel code encadre les activités privées de sécurité ?",["Code de la route","Code de la sécurité intérieure","Code du travail uniquement","Code de la consommation"],1,"Le Livre VI du CSI régit ces activités."],
["Quel organisme délivre la carte professionnelle ?",["La mairie","Le CNAPS","La Poste","L'URSSAF"],1,"Le CNAPS (via ses commissions) délivre et contrôle les cartes."],
["Quelle est la durée de validité de la carte professionnelle ?",["1 an","2 ans","5 ans","10 ans"],2,"Elle est valable 5 ans, renouvelable sous conditions."],
["Un agent de sécurité privé a-t-il les mêmes pouvoirs qu'un policier ?",["Oui, dans l'enceinte surveillée","Oui, s'il est armé","Non, ses pouvoirs sont limités","Oui, avec la carte professionnelle"],2,"Il n'a pas de pouvoir de police ; il agit dans le cadre de la loi comme tout citoyen, avec des prérogatives limitées."],
["Un agent peut-il porter une tenue pouvant prêter à confusion avec celle des forces de l'ordre ?",["Oui","Non, c'est interdit","Oui, la nuit","Oui, avec accord du client"],1,"La tenue ne doit pas créer de confusion avec les forces publiques."]]},
{t:"Missions et pouvoirs de l'agent",c:`<h3>Flagrant délit (art. 73 du Code de procédure pénale)</h3><ul><li>Toute personne peut appréhender l'auteur d'un <b>crime ou délit flagrant puni d'une peine de prison</b>.</li><li>Elle doit le <b>conduire sans délai devant un officier de police judiciaire (OPJ)</b> : on appelle donc le 17.</li><li>Usage de la force limité à ce qui est strictement nécessaire.</li></ul><h3>Contrôle d'accès, fouilles et palpations</h3><ul><li><b>Inspection visuelle</b> des bagages à main possible ; <b>fouille</b> uniquement avec le <b>consentement</b> du propriétaire.</li><li><b>Palpation de sécurité</b> : consentement, par une personne <b>de même sexe</b>, et seulement dans les cas prévus par la loi.</li><li>En cas de refus : l'agent peut refuser l'accès, il ne force jamais.</li></ul><h3>Légitime défense et assistance</h3><ul><li><b>Légitime défense (art. 122-5 CP)</b> : riposte <b>nécessaire, proportionnée</b>, face à une atteinte <b>injustifiée et actuelle</b>.</li><li><b>Non-assistance à personne en danger (art. 223-6 CP)</b> : délit pour qui s'abstient volontairement de porter secours.</li></ul>`,
q:[["En cas de flagrant délit, que doit faire l'agent après avoir appréhendé l'auteur ?",["Le relâcher après avoir noté son identité","Le conduire sans délai devant un OPJ","Le retenir plusieurs heures","Le punir lui-même"],1,"Art. 73 CPP : présentation à un OPJ, d'où l'appel au 17."],
["Pour fouiller le sac d'un client, il faut :",["Rien de particulier","Son consentement","L'accord du directeur uniquement","Un simple soupçon"],1,"La fouille des bagages exige le consentement du propriétaire."],
["Une palpation de sécurité doit être réalisée par :",["Un agent de n'importe quel sexe","Une personne de même sexe, avec consentement","Un agent mineur","Le client lui-même"],1,"Palpation : consentement et même sexe, dans les cas prévus."],
["La légitime défense suppose une riposte :",["Disproportionnée mais rapide","Nécessaire et proportionnée à l'attaque","Différée dans le temps","Toujours armée"],1,"Elle doit être nécessaire et proportionnée à une atteinte injustifiée et actuelle."],
["Quel texte réprime la non-assistance à personne en danger ?",["Art. 223-6 du Code pénal","Art. 1 du Code civil","Art. 73 du CPP","Art. L611 du CSI"],0,"C'est l'art. 223-6 du Code pénal."]]},
{t:"Secourisme (SST)",c:`<h3>Protéger – Examiner – Alerter – Secourir</h3><ul><li><b>Protéger</b> : écarter le danger pour soi, la victime, les témoins.</li><li><b>Examiner</b> : la victime répond-elle ? respire-t-elle ?</li><li><b>Alerter</b> : <b>15</b> (SAMU), <b>18</b> (pompiers), <b>112</b> (numéro européen), <b>17</b> (police).</li><li><b>Secourir</b> : geste adapté.</li></ul><h3>Gestes essentiels</h3><ul><li><b>Hémorragie</b> : compression directe de la plaie avec la main ou un tampon.</li><li><b>Inconsciente qui respire</b> : <b>Position Latérale de Sécurité (PLS)</b>, surveiller la respiration.</li><li><b>Arrêt cardiaque (inconsciente, ne respire pas)</b> : alerter, <b>massage cardiaque</b> (100 à 120 compressions/min), défibrillateur (DAE) dès que possible.</li><li><b>Brûlure</b> : refroidir à l'eau tempérée.</li></ul><div class="key">Message d'alerte : lieu précis, nature du problème, nombre de victimes, état, gestes réalisés. Ne raccrochez qu'à la demande des secours.</div>`,
q:[["Quel est le premier réflexe du sauveteur ?",["Déplacer la victime","Protéger la zone","Donner à boire","Filmer la scène"],1,"On commence toujours par protéger."],
["Une victime inconsciente respire normalement. Que faire ?",["La laisser sur le dos","La mettre en PLS et alerter","Lui donner à boire","La faire marcher"],1,"PLS, alerte et surveillance de la respiration."],
["Que faire face à une hémorragie externe ?",["Un garrot systématique","Comprimer directement la plaie","Rincer à l'alcool","Attendre les secours"],1,"La compression directe est le geste de première intention."],
["Rythme des compressions thoraciques en cas d'arrêt cardiaque ?",["30 par minute","60 par minute","100 à 120 par minute","200 par minute"],2,"100 à 120 compressions par minute."],
["Quel numéro appeler pour le SAMU ?",["15","17","18","115"],0,"15 SAMU, 17 police, 18 pompiers, 112 européen."]]},
{t:"Prévention et risque d'incendie",c:`<h3>Le feu</h3><ul><li><b>Triangle du feu</b> : combustible + comburant (oxygène) + énergie d'activation (chaleur). Supprimer un côté éteint le feu.</li><li><b>Classes de feux</b> : <b>A</b> solides (bois, papier) ; <b>B</b> liquides (essence, solvants) ; <b>C</b> gaz ; <b>D</b> métaux ; <b>F</b> huiles et graisses de cuisson.</li></ul><h3>Moyens d'extinction</h3><ul><li><b>Eau (pulvérisée)</b> : feux de classe A.</li><li><b>CO₂ / poudre</b> : feux d'origine électrique, liquides.</li><li>Ne jamais utiliser de l'eau sur un feu électrique ou sur une friteuse.</li></ul><h3>Conduite à tenir</h3><ul><li><b>Donner l'alarme</b>, <b>alerter les pompiers (18 ou 112)</b>, évacuer.</li><li>Tenter d'éteindre un début d'incendie seulement si c'est sans danger.</li><li>Évacuer : portes fermées derrière soi, ne pas prendre l'ascenseur, rejoindre le point de rassemblement.</li></ul>`,
q:[["Que comprend le triangle du feu ?",["Eau, air, terre","Combustible, comburant, énergie d'activation","Gaz, bois, fumée","Chaleur, eau, vent"],1,"Combustible, comburant et énergie d'activation."],
["Un feu d'essence est de classe :",["A","B","C","D"],1,"Classe B : liquides inflammables."],
["Quel agent éteint un feu de friteuse (classe F) ?",["De l'eau en jet","Un extincteur adapté à la classe F ou une couverture étouffante","Un seau d'eau","Un ventilateur"],1,"Jamais d'eau sur de l'huile enflammée."],
["Face à un début d'incendie, la priorité est :",["Filmer","Donner l'alarme et alerter les secours","Ouvrir les fenêtres","Rentrer chercher ses affaires"],1,"Alarme, alerte 18/112, évacuation."],
["En évacuation, on prend :",["L'ascenseur","Les escaliers","Le monte-charge","Le parking en voiture"],1,"Jamais l'ascenseur en cas d'incendie."]]},
{t:"Communication et gestion des conflits",c:`<h3>Bien communiquer</h3><ul><li><b>Verbal</b> : voix posée, vocabulaire clair, vouvoiement, pas d'insulte ni d'ironie.</li><li><b>Non verbal</b> : posture ouverte, mains visibles, regard, distance de sécurité.</li><li><b>Écoute active</b> : laisser parler, reformuler, poser des questions ouvertes.</li></ul><h3>Désamorcer un conflit</h3><ul><li>Rester <b>calme</b>, ne pas répondre à la provocation.</li><li>Expliquer la règle et ses raisons, proposer une solution.</li><li>S'isoler de la foule, appeler des renforts si besoin.</li><li>Le recours à la force est <b>le dernier recours</b>, proportionné.</li></ul><h3>Rendre compte</h3><ul><li>Rédiger une <b>main courante</b> / un rapport <b>factuel</b> : qui, quoi, quand, où, comment ; sans jugement.</li><li>Signaler tout incident à sa hiérarchie.</li></ul>`,
q:[["Face à une personne agressive verbalement, la meilleure attitude est :",["Hausser le ton","Rester calme et parler d'une voix posée","L'ignorer","La menacer"],1,"Le calme favorise la désescalade."],
["L'écoute active consiste à :",["Couper la parole","Reformuler et poser des questions ouvertes","Penser à autre chose","Donner des ordres"],1,"Reformuler montre qu'on a compris."],
["Dans un rapport d'incident, on écrit :",["Des opinions personnelles","Des faits précis et objectifs","Des suppositions","Des insultes"],1,"Qui, quoi, quand, où, comment : des faits."],
["Le recours à la force est :",["Le premier réflexe","Le dernier recours, proportionné","Obligatoire","Toujours interdit"],1,"Dernier recours, strictement nécessaire et proportionné."],
["Quelle posture adopter face à un interlocuteur tendu ?",["Bras croisés, très proche","Mains visibles, distance de sécurité","Dos tourné","Doigt pointé"],1,"Posture ouverte et distance de sécurité."]]},
{t:"Sensibilisation aux risques terroristes (Vigipirate)",c:`<h3>Le plan</h3><ul><li><b>Vigipirate</b> est le plan gouvernemental de vigilance, de prévention et de protection face à la menace terroriste.</li><li>Trois niveaux : <b>Vigilance</b>, <b>Sécurité renforcée – risque attentat</b>, <b>Urgence attentat</b>.</li><li>Les agents participent à la vigilance : contrôle d'accès, inspection visuelle des bagages, surveillance des abords.</li></ul><h3>Réflexes</h3><ul><li><b>Colis ou bagage abandonné</b> : ne pas toucher, écarter le public, établir un périmètre, alerter (17 ou 112) et la hiérarchie.</li><li><b>Attaque</b> : <b>s'échapper, se cacher, alerter</b>.</li><li>Signaler tout comportement suspect (repérages, vêtements inadaptés, insistance anormale).</li></ul><div class="key">L'agent observe, signale et protège ; il ne fait jamais le travail des forces de l'ordre.</div>`,
q:[["Que fait-on face à un colis suspect abandonné ?",["On l'ouvre pour vérifier","On ne le touche pas, on écarte le public et on alerte","On le déplace dehors","On l'ignore"],1,"Ne jamais toucher : périmètre de sécurité, puis alerte."],
["Combien de niveaux comporte Vigipirate ?",["1","2","3","5"],2,"Vigilance, Sécurité renforcée – risque attentat, Urgence attentat."],
["En cas d'attaque, le réflexe est :",["Affronter l'agresseur","S'échapper, se cacher, alerter","Filmer","Rester sur place"],1,"S'échapper, se cacher, alerter."],
["Vigipirate est un plan contre :",["Les incendies","La menace terroriste","Les cambriolages","Les épidémies"],1,"Il vise la menace terroriste."],
["Face à un comportement suspect, l'agent :",["Intervient seul avec force","Observe, signale et alerte","Ne dit rien","Fouille la personne"],1,"Il observe et signale ; il n'agit pas comme la police."]]},
{t:"Armes et catégories",c:`<h3>Classement des armes</h3><ul><li><b>Catégorie A</b> : matériels de guerre, interdits (sauf exceptions très encadrées).</li><li><b>Catégorie B</b> : soumises à <b>autorisation</b>.</li><li><b>Catégorie C</b> : soumises à <b>déclaration</b>.</li><li><b>Catégorie D</b> : acquisition libre ou enregistrement (bâtons, aérosols, etc.).</li></ul><h3>Pour l'agent de sécurité</h3><ul><li>Le port d'une arme n'est <b>jamais libre</b> : il faut une <b>autorisation</b>, une <b>formation</b> et une mission qui le permet.</li><li>Une arme de catégorie D peut être interdite au port sans <b>motif légitime</b>.</li><li>L'usage d'une arme reste soumis à la <b>légitime défense</b> : nécessité et proportionnalité.</li></ul><div class="key">En cas de doute, l'agent n'utilise pas d'arme et alerte les forces de l'ordre.</div>`,
q:[["Quelle catégorie est soumise à autorisation ?",["A","B","C","D"],1,"La catégorie B est soumise à autorisation (C : déclaration)."],
["Quelle catégorie correspond aux armes de guerre ?",["A","B","C","D"],0,"Catégorie A : matériels de guerre."],
["Un agent peut-il porter une arme de son choix ?",["Oui","Non, autorisation et formation obligatoires","Oui, la nuit","Oui, si le client le demande"],1,"Le port est strictement encadré."],
["L'usage d'une arme doit respecter :",["Le bon vouloir de l'agent","La nécessité et la proportionnalité","Les ordres du client","Aucune règle"],1,"Légitime défense : nécessité et proportionnalité."],
["Les armes de catégorie C sont soumises à :",["Autorisation","Déclaration","Interdiction","Aucune formalité"],1,"C : déclaration."]]},
{t:"Gestion des conflits en situation",c:`<h3>Évaluer avant d'agir</h3><ul><li>Repérer le danger, le nombre de personnes, l'état (alcool, stress), les issues.</li><li>Ne jamais intervenir <b>seul</b> si le risque est élevé : prévenir la radio, le PC sécurité, appeler le 17.</li></ul><h3>Méthode DESC</h3><ul><li><b>D</b>écrire les faits, <b>E</b>xprimer ce qu'on ressent ou la règle, <b>S</b>uggérer une solution, rappeler les <b>C</b>onséquences.</li></ul><h3>Cas fréquents</h3><ul><li><b>Personne alcoolisée</b> : calme, phrases courtes, pas de provocation, refus d'accès si nécessaire.</li><li><b>Refus de contrôle</b> : rappeler la règle, proposer une alternative, ne pas forcer.</li><li><b>Bagarre</b> : sécuriser les abords, appeler renforts et secours, ne pas s'interposer seul.</li></ul>`,
q:[["Face à une bagarre à plusieurs, l'agent doit d'abord :",["S'interposer seul","Alerter, sécuriser et attendre les renforts","Frapper","Partir"],1,"Ne pas s'interposer seul : renforts et alerte."],
["Que signifie DESC ?",["Décrire, Exprimer, Suggérer, Conséquences","Discuter, Écouter, Soutenir, Contrôler","Dire, Écrire, Signer, Classer","Défendre, Éviter, Sortir, Contacter"],0,"C'est une méthode d'expression assertive."],
["Face à une personne alcoolisée agressive :",["Hausser le ton","Rester calme et parler simplement","La provoquer","La toucher"],1,"Calme, phrases courtes, pas de provocation."],
["Un client refuse le contrôle des sacs :",["On le fouille de force","On rappelle la règle et on peut refuser l'accès","On le laisse entrer","On l'insulte"],1,"Pas de contrainte : l'accès peut être refusé."],
["Avant d'intervenir, l'agent doit :",["Évaluer la situation","Courir","Crier","Filmer"],0,"Évaluer le danger avant d'agir."]]},
{t:"Droit du travail du salarié de la sécurité",c:`<h3>Cadre</h3><ul><li>Convention collective : <b>entreprises de prévention et de sécurité</b>.</li><li>Contrat : CDI, CDD, intérim ; période d'essai prévue par le contrat et la convention.</li></ul><h3>Temps de travail (règles générales)</h3><ul><li>Durée légale : <b>35 h par semaine</b>.</li><li>Durée maximale quotidienne : <b>10 h</b> (sauf dérogation) ; hebdomadaire : <b>48 h</b>, <b>44 h</b> en moyenne sur 12 semaines.</li><li>Repos quotidien : <b>11 h consécutives</b> ; repos hebdomadaire : <b>24 h</b> + 11 h.</li><li>Pause : <b>20 minutes</b> après 6 h de travail consécutives.</li></ul><h3>Santé et sécurité</h3><ul><li><b>Droit de retrait</b> en cas de danger grave et imminent.</li><li>Suivi médical par la médecine du travail ; équipements de protection fournis.</li></ul>`,
q:[["Quelle est la durée légale hebdomadaire ?",["30 h","35 h","39 h","48 h"],1,"35 heures par semaine."],
["Quel est le repos quotidien minimal ?",["8 h","9 h","11 h","13 h"],2,"11 heures consécutives."],
["Après 6 h de travail consécutives, la pause minimale est de :",["10 min","20 min","45 min","1 h"],1,"20 minutes minimum."],
["Le droit de retrait s'exerce en cas de :",["Désaccord avec un collègue","Danger grave et imminent","Fatigue légère","Retard du client"],1,"Danger grave et imminent pour la vie ou la santé."],
["La durée maximale hebdomadaire absolue est de :",["35 h","44 h","48 h","60 h"],2,"48 h (44 h en moyenne sur 12 semaines)."]]},
{t:"Stratégique : métier et posture professionnelle",c:`<h3>Connaître son métier et son environnement</h3><ul><li>Missions de l'agent APS : <b>surveillance humaine et gardiennage</b>, contrôle d'accès, rondes, accueil, prévention des vols et intrusions.</li><li>Acteurs : le <b>client (donneur d'ordre)</b>, l'<b>employeur</b> (société de sécurité), le <b>responsable de site</b>, les forces de l'ordre et les secours.</li><li>Les missions sont cadrées par un <b>contrat</b> et des <b>consignes écrites</b> du site : on n'invente pas de mission.</li></ul><h3>Posture professionnelle</h3><ul><li>Tenue correcte, ponctualité, vouvoiement, attitude neutre et courtoise.</li><li><b>Prévenir, dissuader, détecter, alerter, rendre compte</b>.</li><li>Observer sans se mettre en danger ; ne pas quitter son poste sans relève.</li></ul><h3>Rendre compte</h3><ul><li><b>Main courante</b> : registre chronologique des événements du poste.</li><li>Respecter la <b>chaîne hiérarchique</b> et la confidentialité.</li><li><b>Passation</b> des consignes à la relève.</li></ul><div class="key">L'agent est un maillon de la sécurité du site : il prévient, alerte et rend compte avec précision.</div>`,
q:[["Quelle est la mission principale d'un agent APS ?",["Mener des enquêtes judiciaires","La surveillance humaine et le gardiennage","Arrêter les suspects","Gérer la comptabilité du client"],1,"L'agent APS assure la surveillance humaine et le gardiennage de sites, biens et personnes."],
["Quel document consigne chronologiquement les événements du poste ?",["Le bulletin de paie","La main courante","Le contrat de travail","Le plan de l'immeuble"],1,"La main courante garde la trace datée des événements."],
["À qui l'agent rend-il compte d'un incident ?",["À personne","À sa hiérarchie (chef de poste, responsable)","Aux réseaux sociaux","Au premier passant"],1,"Il respecte la chaîne hiérarchique et la confidentialité."],
["Les missions de l'agent sont définies par :",["Son humeur","Le contrat et les consignes écrites du site","Les demandes de n'importe qui","Les habitudes de la veille"],1,"Contrat et consignes cadrent la mission."],
["À la fin du service, l'agent doit :",["Partir sans prévenir","Assurer la passation à la relève","Effacer la main courante","Garder les clés"],1,"La passation garantit la continuité de la sécurité."]]},
{t:`Modalités d'appréhension`,c:`<h3>Conditions légales</h3><ul><li>Base : <b>art. 73 du Code de procédure pénale</b> : toute personne peut appréhender l'auteur d'un <b>crime ou délit flagrant puni d'emprisonnement</b>.</li><li><b>Flagrance</b> : l'infraction se commet ou vient de se commettre, ou la personne est poursuivie par la clameur publique ou trouvée avec des objets ou traces qui l'accusent.</li></ul><h3>Conduite à tenir</h3><ul><li>Évaluer le danger, <b>alerter</b> (17) et la hiérarchie.</li><li>Se présenter, ordonner calmement l'arrêt des faits.</li><li>Force <b>strictement nécessaire et proportionnée</b> : jamais de coups, d'étranglement ni de geste dangereux.</li><li>Surveiller la personne (santé), ne pas l'interroger.</li><li>La remettre à l'<b>OPJ</b>, <b>rendre compte par écrit</b>, préserver les indices (ne pas toucher aux traces).</li></ul>`,
q:[[`Quel article du CPP permet d'appréhender l'auteur d'un flagrant délit ?`,[`L'article 73`,`L'article 1`,`L'article 223-6`,`L'article 122-5`],0,`L'art. 73 du CPP ouvre cette possibilité à toute personne.`],[`L'appréhension est possible pour :`,[`Toute infraction`,`Un crime ou délit flagrant puni d'emprisonnement`,`Une simple dispute`,`Une contravention de stationnement`],1,`Il faut un crime ou délit flagrant puni d'une peine de prison.`],[`La force employée doit être :`,[`Maximale`,`Strictement nécessaire et proportionnée`,`Punitive`,`Laissée à l'appréciation du client`],1,`Nécessité et proportionnalité.`],[`Après l'appréhension, l'agent :`,[`Garde la personne toute la nuit`,`La remet sans délai à un OPJ`,`La relâche sans rien dire`,`La fouille entièrement`],1,`Remise à l'OPJ, d'où l'appel au 17.`],[`Que faire des indices et traces ?`,[`Les nettoyer`,`Les préserver sans y toucher`,`Les jeter`,`Les emporter chez soi`],1,`On préserve la scène pour les enquêteurs.`]]},
{t:`Module professionnel : l'exercice du métier`,c:`<h3>Missions de l'agent</h3><ul><li><b>Accueil et orientation</b> du public, <b>contrôle d'accès</b> (badges, registre des visiteurs).</li><li><b>Rondes</b> : itinéraire et horaires variables, points de contrôle, vérification des issues, de l'éclairage, des extincteurs.</li><li>Gestion des <b>clés</b> et des alarmes, ouverture et fermeture du site.</li></ul><h3>Outils et écrits</h3><ul><li><b>Main courante</b>, rapports d'incident, consignes de poste, registre des visiteurs.</li><li>Communication : radio, téléphone, <b>alphabet phonétique</b> pour épeler ; messages brefs et clairs.</li></ul><h3>Attitude</h3><ul><li>Vigilance, ponctualité, tenue, courtoisie, neutralité, confidentialité.</li><li>Devant une anomalie : <b>observer, alerter, rendre compte</b>, sans prendre de risque inutile.</li></ul>`,
q:[[`Une ronde sert à :`,[`Se promener`,`Surveiller, vérifier et détecter les anomalies`,`Dormir`,`Accueillir les clients`],1,`La ronde détecte les anomalies et dissuade.`],[`À quoi sert l'alphabet phonétique ?`,[`À décorer les rapports`,`À épeler sans ambiguïté à la radio`,`À parler aux enfants`,`À rédiger la main courante`],1,`Il évite les confusions de lettres.`],[`Anomalie constatée pendant une ronde :`,[`On l'ignore`,`On observe, on alerte, on rend compte`,`On intervient seul coûte que coûte`,`On rentre chez soi`],1,`Observer, alerter, rendre compte.`],[`Le registre des visiteurs permet de :`,[`Tracer les entrées et sorties`,`Compter les cafés`,`Noter les horaires de repas`,`Remplacer la main courante`],0,`Il assure la traçabilité du contrôle d'accès.`],[`Les clés du site :`,[`Se prêtent librement`,`Sont gérées avec traçabilité, sans prêt non autorisé`,`Restent dans la voiture`,`Sont copiées`],1,`Gestion contrôlée et tracée.`]]},
{t:`Palpation de sécurité et inspection des bagages`,c:`<h3>Cadre</h3><ul><li><b>Inspection visuelle</b> des bagages à main : possible ; <b>fouille</b> du contenu seulement avec le <b>consentement</b> du propriétaire.</li><li><b>Palpation de sécurité</b> : consentement de la personne, réalisée par une personne <b>de même sexe</b>, uniquement dans les cas prévus par la loi (par exemple certaines manifestations ou menaces graves) et par un agent habilité.</li><li>En cas de refus : <b>refuser l'accès</b>, jamais de contrainte ; informer la hiérarchie.</li></ul><h3>Bonnes pratiques</h3><ul><li>Annoncer chaque geste, rester courtois, éviter les regards si possible.</li><li>Gestes professionnels, respectueux, sans geste déplacé.</li><li>Objet dangereux ou illicite : ne pas le manipuler inutilement, alerter la police.</li></ul>`,
q:[[`Pour fouiller le contenu d'un sac, il faut :`,[`Rien`,`Le consentement du propriétaire`,`Un soupçon`,`L'ordre du client`],1,`Fouille = consentement.`],[`La palpation de sécurité est faite par :`,[`Une personne de même sexe`,`N'importe qui`,`Un agent non habilité`,`Le client`],0,`Même sexe, consentement, agent habilité.`],[`Une personne refuse la palpation. L'agent :`,[`Force`,`Refuse l'accès et rend compte`,`La laisse entrer`,`L'insulte`],1,`Pas de contrainte : refus d'accès.`],[`L'inspection visuelle d'un sac consiste à :`,[`Vider le contenu de force`,`Regarder sans fouiller le contenu`,`Saisir le sac`,`Le jeter`],1,`Regarder ; la fouille du contenu exige l'accord.`],[`Objet dangereux découvert :`,[`On le manipule librement`,`On évite de le manipuler inutilement et on alerte la police`,`On le garde`,`On le cache`],1,`Sécurité d'abord, puis alerte.`]]},
{t:`Surveillance par moyens électroniques de sécurité`,c:`<h3>Les systèmes</h3><ul><li><b>Vidéoprotection</b>, <b>détection d'intrusion</b> (alarme), <b>contrôle d'accès</b> (badges), <b>SSI</b> (système de sécurité incendie).</li><li>Le <b>PC sécurité</b> centralise alarmes et images.</li></ul><h3>Règles</h3><ul><li><b>Affichage obligatoire</b> pour informer le public de la vidéoprotection.</li><li>Respect de la <b>vie privée</b> : pas de caméra dans les lieux intimes (toilettes, vestiaires).</li><li>Les images sont <b>confidentielles</b>, conservées une durée limitée (en général un mois maximum) et communiquées seulement aux personnes habilitées ou à la justice.</li></ul><h3>Conduite à tenir</h3><ul><li><b>Levée de doute</b> (images, ronde), alerter, consigner à la main courante. On n'ignore jamais une alarme.</li></ul>`,
q:[[`Que doit-on afficher en cas de vidéoprotection ?`,[`Rien`,`Une information du public`,`Le salaire des agents`,`Un menu`],1,`Le public doit être informé.`],[`Une caméra dans des toilettes est :`,[`Autorisée`,`Interdite`,`Recommandée`,`Obligatoire`],1,`Atteinte à la vie privée.`],[`Que centralise le PC sécurité ?`,[`Les courriers`,`Les alarmes et les images`,`Les repas`,`Les clés de voiture`],1,`Alarmes et vidéo.`],[`Les images enregistrées sont :`,[`Publiques`,`Confidentielles, accès aux personnes habilitées`,`Postées en ligne`,`Vendues`],1,`Confidentialité et durée de conservation limitée.`],[`Face à une alarme :`,[`On l'ignore`,`Levée de doute, alerte et consigne à la main courante`,`On la coupe`,`On attend demain`],1,`Levée de doute, alerte, compte rendu.`]]},
{t:`Gestion des risques`,c:`<h3>Vocabulaire</h3><ul><li><b>Danger</b> : ce qui peut causer un dommage. <b>Risque</b> : probabilité qu'un danger cause un dommage, selon sa gravité.</li><li><b>Prévention</b> : réduire la probabilité ; <b>protection</b> : réduire la gravité.</li></ul><h3>Démarche</h3><ul><li><b>Identifier</b> les dangers, <b>évaluer</b> (probabilité, gravité), <b>traiter</b>, <b>suivre</b>.</li><li>Le <b>DUERP</b> (document unique d'évaluation des risques professionnels) est obligatoire en entreprise.</li><li>Risques du métier : agressions, travail isolé et de nuit, chutes, risque routier, stress.</li></ul><h3>Remonter l'information</h3><ul><li>Signaler dangers et accidents, porter les <b>EPI</b>, respecter les consignes. <b>Plan de prévention</b> quand une entreprise extérieure intervient sur un site.</li></ul>`,
q:[[`Que signifie DUERP ?`,[`Document unique d'évaluation des risques professionnels`,`Dossier unique des rendez-vous`,`Droit unique de retrait pro`,`Document usuel de ronde`],0,`C'est le document unique d'évaluation des risques professionnels.`],[`La prévention agit sur :`,[`La probabilité de survenue`,`La météo`,`Le salaire`,`Les horaires`],0,`Elle réduit la probabilité d'un événement.`],[`La protection vise à :`,[`Augmenter la gravité`,`Réduire la gravité des dommages`,`Cacher le danger`,`Supprimer les règles`],1,`Protéger limite les dégâts.`],[`Premier pas de la démarche de gestion des risques :`,[`Identifier les dangers`,`Sanctionner`,`Ignorer`,`Acheter du matériel`],0,`Identifier, évaluer, traiter, suivre.`],[`Un plan de prévention est établi quand :`,[`Une entreprise extérieure intervient sur le site`,`Il pleut`,`Un visiteur arrive`,`Un agent est en retard`],0,`Pour les interventions d'entreprises extérieures.`]]},
{t:`Événementiel spécifique`,c:`<h3>Contexte</h3><ul><li>Concerts, matchs, festivals, salons : forte densité de public, <b>ERP</b> (établissement recevant du public) avec <b>capacité maximale</b> à respecter.</li><li>Agents identifiables, coordination avec l'organisateur, le PC et les secours.</li></ul><h3>Missions</h3><ul><li><b>Filtrage et contrôle d'accès</b> (billets, bagages, palpation dans le cadre légal).</li><li><b>Gestion des flux</b> : couloirs, files, barrières, pour éviter les mouvements de foule.</li><li><b>Prévention</b> des débordements (alcool, objets interdits), repérage des personnes en difficulté.</li><li><b>Évacuation</b> : connaître issues, plan, point de rassemblement ; guider calmement.</li></ul><div class='key'>Mieux vaut agir tôt (ouvrir des accès, réguler) que gérer un mouvement de panique.</div>`,
q:[[`La gestion des flux sert à :`,[`Éviter bousculades et mouvements de foule`,`Vendre des billets`,`Faire du bruit`,`Retarder le spectacle`],0,`Elle fluidifie le public et limite les risques.`],[`ERP signifie :`,[`Établissement recevant du public`,`Équipe de rondes privées`,`Entrée réservée aux pros`,`Espace de repos pour agents`],0,`Établissement recevant du public.`],[`Il faut respecter dans un ERP :`,[`La capacité maximale`,`Le nombre d'agents uniquement`,`Rien`,`Les goûts du public`],0,`La capacité maximale d'accueil.`],[`En cas d'évacuation, l'agent :`,[`Court devant`,`Guide calmement vers les issues`,`Ferme les portes`,`Reste caché`],1,`Il guide calmement vers les issues et le point de rassemblement.`],[`La palpation en événementiel nécessite :`,[`Le consentement, même sexe, cadre légal`,`Rien de particulier`,`L'ordre du public`,`Un agent mineur`],0,`Consentement, même sexe, cadre légal et agent habilité.`]]},
{t:`Industriel spécifique`,c:`<h3>Sites industriels</h3><ul><li>Usines, entrepôts, sites <b>ICPE</b> (installations classées pour la protection de l'environnement), sites <b>Seveso</b> (risque d'accident majeur).</li><li>Risques : incendie, explosion, fuite de produits chimiques, pollution.</li></ul><h3>Règles pour l'agent</h3><ul><li>Respecter les <b>consignes</b> du site et le <b>plan de prévention</b>.</li><li><b>EPI</b> obligatoires (casque, chaussures de sécurité, lunettes...).</li><li>Reconnaître les <b>pictogrammes</b> de danger ; ne jamais manipuler un produit inconnu.</li><li>Contrôle d'accès rigoureux : visiteurs, sous-traitants, véhicules.</li><li><b>Permis de feu</b> pour les travaux par points chauds, avec surveillance renforcée.</li></ul><div class='key'>Accident ou fuite : alerter, mettre en sécurité, évacuer selon les consignes du site.</div>`,
q:[[`ICPE signifie :`,[`Installation classée pour la protection de l'environnement`,`Institut de contrôle`,`Instance centrale pour l'emploi`,`Inspection du poste d'entrée`],0,`Installation classée pour la protection de l'environnement.`],[`Un site Seveso présente :`,[`Un risque d'accident majeur`,`Aucun risque`,`Un risque de bruit`,`Un risque administratif`],0,`Seveso : risque d'accident majeur.`],[`Les EPI sont :`,[`Optionnels`,`Obligatoires selon les consignes`,`Interdits`,`Réservés au chef`],1,`Équipements de protection individuelle obligatoires.`],[`Face à un produit inconnu :`,[`On le manipule`,`On ne le touche pas et on alerte`,`On le goûte`,`On le déplace`],1,`Jamais de manipulation inutile.`],[`Le permis de feu concerne :`,[`Les travaux par points chauds`,`La cantine`,`Le parking`,`Les congés`],0,`Les travaux par points chauds (soudure, meulage).`]]},
{t:`Mise en situation pratique`,c:`<h3>Aborder une mise en situation</h3><ul><li><b>Observer</b> la situation et évaluer le danger.</li><li><b>Se présenter</b>, parler calmement, vouvoyer.</li><li><b>Agir dans son cadre légal</b> : aucune contrainte hors de la loi.</li><li><b>Alerter</b> : collègues, hiérarchie, 15, 17, 18 ou 112.</li><li><b>Rendre compte</b> à l'oral, puis par écrit (main courante).</li></ul><h3>Check-list</h3><ul><li>La sécurité des personnes d'abord, puis celle des biens.</li><li>Justifier chaque action par un texte ou une consigne.</li></ul>`,
q:[[`Un visiteur sans badge veut entrer. Vous :`,[`Le laissez passer`,`Vérifiez poliment son identité ou son autorisation`,`Le poussez`,`L'ignorez`],1,`Contrôle courtois, appel du référent si besoin.`],[`Une personne inconsciente respire. Vous :`,[`La laissez`,`La mettez en PLS et alertez`,`La faites boire`,`La secouez`],1,`PLS puis alerte 15 ou 112.`],[`Un client refuse d'ouvrir son sac. Vous :`,[`Forcez`,`Refusez l'accès sans fouille forcée`,`Fouillez en cachette`,`L'insultez`],1,`Pas de fouille sans consentement.`],[`Vous surprenez un vol en flagrant délit. Vous :`,[`Ne faites rien`,`Alertez, appréhendez si c'est sans danger, remettez à l'OPJ`,`Frappez`,`Poursuivez sur la route`],1,`Alerte, appréhension proportionnée et remise à l'OPJ.`],[`Début d'incendie dans un local :`,[`Donner l'alarme, alerter le 18, évacuer`,`Fermer les yeux`,`Prendre l'ascenseur`,`Jeter de l'eau sur un tableau électrique`],0,`Alarme, 18, évacuation, extinction seulement si c'est sans danger.`]]}
];

const H=[
[[`Quelles sanctions la commission de contrôle du CNAPS peut-elle prononcer ?`,[`Avertissement, blâme, pénalité financière, interdiction temporaire d'exercer`,`Une peine de prison`,`La confiscation du véhicule personnel`,`Une amende de police immédiate`],0,`Le contrôle disciplinaire relève du CNAPS : avertissement, blâme, pénalité, interdiction temporaire.`],[`Un client demande à l'agent de ne pas signaler un vol commis par un proche. L'agent :`,[`Obéit`,`Rend compte à sa hiérarchie, comme ses obligations le prévoient`,`Détruit la preuve`,`Négocie une compensation`],1,`L'agent ne dissimule pas une infraction ; il rend compte.`],[`Quelle attitude respecte la déontologie ?`,[`Refuser l'accès selon l'origine`,`Traiter chacun avec respect, sans discrimination`,`Diffuser des images de vidéosurveillance entre collègues`,`Se faire passer pour un policier`],1,`Neutralité, respect, confidentialité.`]],
[[`Un voleur s'enfuit avec un sac. Pas de danger immédiat pour vous. La conduite conforme est :`,[`Alerter le 17, rendre compte, n'appréhender que si c'est possible sans danger et avec la force strictement nécessaire`,`Lui tirer dessus`,`Le fouiller de force`,`Ignorer car ce n'est pas la mission`],0,`Alerte d'abord ; l'appréhension (art. 73 CPP) reste une faculté proportionnée.`],[`La légitime défense suppose notamment :`,[`Une riposte pour punir après coup`,`Une atteinte injustifiée et actuelle, une riposte nécessaire et proportionnée`,`Une bagarre provoquée par l'agent`,`Une riposte préventive`],1,`Art. 122-5 du Code pénal.`],[`L'obligation de porter secours (art. 223-6 CP) concerne :`,[`Les seuls secouristes diplômés`,`Toute personne pouvant agir sans risque pour elle ou pour les tiers`,`Les seuls policiers`,`Uniquement les agents en service`],1,`Elle vise toute personne pouvant intervenir sans risque.`]],
[[`Une victime consciente a une douleur thoracique intense, des sueurs, la douleur irradie dans le bras. Vous :`,[`Lui faites faire un effort`,`L'installez au repos et alertez le 15`,`Lui donnez à boire`,`Attendez que ça passe`],1,`Repos strict, alerte immédiate du 15.`],[`Pour une brûlure thermique, le geste initial est :`,[`Appliquer du beurre`,`Refroidir à l'eau tempérée pendant environ 10 minutes`,`Percer les cloques`,`Arracher les vêtements collés`],1,`Refroidir longtemps, sans retirer ce qui adhère.`],[`Après la pose des électrodes du défibrillateur :`,[`On masse pendant l'analyse`,`On suit les instructions de l'appareil, personne ne touche la victime pendant l'analyse`,`On retire les électrodes`,`On attend les secours`],1,`Pas de contact pendant l'analyse ni le choc.`]],
[[`Feu de poubelle plastique dans un couloir : l'extincteur le plus adapté est :`,[`Eau pulvérisée (ou poudre polyvalente)`,`Extincteur spécial métaux`,`Un seau d'eau sur le câble voisin`,`Aucun, on souffle`],0,`Classe A : eau pulvérisée ou poudre polyvalente.`],[`Lors d'une évacuation, on :`,[`Prend l'ascenseur si pressé`,`Ferme les portes derrière soi sans les verrouiller`,`Revient chercher ses affaires`,`Crie pour avertir`],1,`Fermer sans verrouiller limite la propagation.`],[`Feu de friteuse : première action ?`,[`Jeter de l'eau`,`Verser de l'eau glacée`,`Couper la source de chaleur, étouffer avec un couvercle adapté, alerter le 18`,`Déplacer la friteuse en feu`],2,`Jamais d'eau sur de l'huile enflammée.`]],
[[`Un usager vous insulte. La réaction la plus professionnelle :`,[`Répondre sur le même ton`,`Rester calme et rappeler la règle sans agressivité`,`Le menacer`,`Le filmer pour le provoquer`],1,`Calme et fermeté, sans escalade.`],[`La communication non verbale :`,[`Est sans importance`,`Peut contredire ou renforcer le message verbal`,`Remplace toujours le verbal`,`Ne concerne que les enfants`],1,`Posture, regard, gestes pèsent autant que les mots.`],[`Quelle formulation est la plus correcte dans un compte rendu ?`,[`Il était manifestement violent`,`À 22 h 15, M. X sentait l'alcool, a crié et a poussé la porte`,`Il avait une tête de menteur`,`Je crois qu'il voulait voler`],1,`Faits précis, horodatés, sans jugement.`]],
[[`Au niveau « Urgence attentat » de Vigipirate :`,[`Rien ne change`,`Des mesures de protection renforcées sont décidées par les autorités`,`Les agents deviennent policiers`,`Les contrôles sont supprimés`],1,`Les mesures sont renforcées et adaptées.`],[`Quelqu'un photographie longuement les accès et caméras d'un site sensible. Vous :`,[`L'agressez`,`Observez, notez les éléments utiles, signalez à la hiérarchie ou au 17`,`L'ignorez`,`Prenez son téléphone`],1,`Observer et signaler, jamais agir comme la police.`],[`Colis suspect : le périmètre doit être :`,[`Inexistant`,`Large, le public éloigné, sans toucher au colis`,`Limité aux agents`,`Fermé en le déplaçant`],1,`On ne touche pas, on éloigne et on alerte.`]],
[[`Un agent a un bâton de défense (cat. D). Peut-il le porter en service sans autre condition ?`,[`Oui, toujours`,`Non : autorisation, formation et cadre de la mission sont nécessaires`,`Oui, la nuit`,`Oui, s'il le souhaite`],1,`Le port reste strictement encadré.`],[`Transporter une arme de catégorie D sans motif légitime est :`,[`Libre`,`Un délit possible`,`Obligatoire`,`Récompensé`],1,`Le port ou transport sans motif légitime peut être puni.`],[`Qui autorise le port d'arme d'un agent dans sa mission ?`,[`Le client`,`L'autorité préfectorale, dans le cadre légal`,`Le chef de poste`,`L'agent lui-même`],1,`L'autorisation relève de l'autorité administrative.`]],
[[`Face à une personne très énervée qui avance vers vous :`,[`Vous la frappez`,`Gardez une distance de sécurité, restez calme, alertez et vous appuyez sur un collègue`,`Lui tournez le dos`,`Haussez le ton`],1,`Distance, calme, alerte, renfort.`],[`Une bagarre éclate. Vous êtes seul :`,[`Vous vous interposez`,`Alertez le 17, surveillez à distance et secourez quand c'est sans danger`,`Filmez`,`Entrez dans la mêlée`],1,`Ne pas s'interposer seul.`],[`La désescalade consiste à :`,[`Menacer plus fort`,`Réduire la tension par le calme, l'écoute et des solutions`,`Ignorer le conflit`,`Fuir sans prévenir`],1,`Calme, écoute, solution.`]],
[[`Un agent travaille de 22 h à 7 h. Repos quotidien minimum avant la prise suivante ?`,[`9 h`,`10 h`,`11 h`,`13 h`],2,`Règle générale : 11 heures consécutives.`],[`On peut quitter son poste sans sanction en cas de :`,[`Désaccord avec la hiérarchie`,`Danger grave et imminent pour sa vie ou sa santé`,`Fatigue passagère`,`Retard de la relève`],1,`Droit de retrait.`],[`Durée hebdomadaire moyenne maximale sur 12 semaines :`,[`35 h`,`40 h`,`44 h`,`48 h`],2,`44 h en moyenne sur 12 semaines, 48 h au plus sur une semaine.`]],
[[`La consigne écrite interdit l'entrée sans badge. Un cadre pressé veut passer. Vous :`,[`Le laissez passer`,`Appliquez poliment la consigne et prévenez votre responsable`,`Le fouillez`,`L'insultez`],1,`Les consignes cadrent la mission.`],[`La chaîne d'information correcte est :`,[`Agent vers la relève seulement`,`Agent vers chef de poste ou responsable de site, puis employeur et donneur d'ordre`,`Agent vers la presse`,`Agent vers un autre client`],1,`Respect de la chaîne hiérarchique.`],[`La passation sert à :`,[`Gagner du temps`,`Garantir la continuité de la sécurité et la transmission des informations`,`Effacer la main courante`,`Réduire les effectifs`],1,`Transmettre les consignes et événements.`]],
[[`Un voleur est en flagrant délit mais menace avec un couteau. L'agent :`,[`L'appréhende de force`,`Évite l'affrontement, alerte le 17 et observe pour renseigner`,`Lui prend le couteau`,`Le poursuit`],1,`La sécurité des personnes prime.`],[`Après appréhension, la personne se plaint d'une douleur à la poitrine. Vous :`,[`Continuez sans rien faire`,`Alertez le 15 et surveillez son état`,`La relâchez sans rien dire`,`La menacez`],1,`La santé de la personne passe avant.`],[`Quelle formule est juste ?`,[`On peut garder la personne jusqu'au lendemain`,`Elle doit être remise sans délai à un OPJ`,`L'agent peut la juger`,`On la remet au client`],1,`Remise sans délai à l'OPJ.`]],
[[`Pendant une ronde de nuit, une porte de secours est entrouverte. Vous :`,[`La refermez sans rien dire`,`Sécurisez, vérifiez les alentours, alertez si anomalie et consignez`,`Partez`,`La déverrouillez`],1,`Observer, sécuriser, alerter, consigner.`],[`Un visiteur n'est pas sur la liste mais dit avoir rendez-vous. Vous :`,[`Le laissez entrer`,`Vérifiez auprès de la personne attendue avant d'autoriser`,`Le renvoyez au hasard`,`Lui donnez un badge`],1,`Contrôle d'accès avant tout.`],[`Quand consigner un incident ?`,[`Dès que possible, de façon factuelle et horodatée`,`Dans une semaine`,`Jamais`,`Après avis d'un ami`],0,`Rapidité et précision.`]],
[[`Une cliente refuse la palpation mais accepte d'ouvrir son sac. L'agent peut :`,[`La palper de force`,`Refuser l'accès si la palpation est la condition, sans contrainte`,`La fouiller en cachette`,`L'insulter`],1,`Consentement obligatoire.`],[`Le respect de la dignité pendant une palpation implique :`,[`Annoncer les gestes, rester professionnel, dans un lieu adapté`,`Ne rien dire`,`Insister`,`Toucher plusieurs fois`],0,`Courtoisie et discrétion.`],[`Objet manifestement dangereux dans un sac. Vous :`,[`Le prenez en main pour le montrer`,`Ne le manipulez pas inutilement, isolez la zone, alertez police et hiérarchie`,`Le jetez`,`Le remettez dans le sac`],1,`Sécurité d'abord.`]],
[[`Durée usuelle de conservation des images de vidéoprotection :`,[`1 mois maximum`,`1 an`,`5 ans`,`Illimitée`],0,`En général un mois au plus.`],[`Un collègue veut envoyer une vidéo d'un incident à des amis :`,[`Permis`,`Interdit : confidentialité et usage réservé aux habilités ou à la justice`,`Obligatoire`,`Conseillé`],1,`Confidentialité des images.`],[`Alarme intrusion la nuit. Premier réflexe :`,[`La couper sans vérifier`,`Lever le doute (caméras, ronde prudente) et alerter selon la consigne`,`Ignorer`,`Attendre le matin`],1,`Levée de doute, alerte, consigne.`]],
[[`Ordre logique de la gestion des risques :`,[`Traiter, identifier, évaluer`,`Identifier, évaluer, traiter, suivre`,`Suivre, traiter, identifier`,`Évaluer seulement`],1,`Démarche en quatre temps.`],[`Un sol glissant non signalé est :`,[`Un danger à signaler et traiter`,`Un risque nul`,`Une obligation`,`Une consigne`],0,`Un danger à traiter.`],[`Le principe de prévention consiste d'abord à :`,[`Supprimer le danger si possible`,`Porter des EPI seulement`,`Attendre l'accident`,`Allonger les consignes`],0,`Supprimer, puis réduire, puis protéger.`]],
[[`Un mouvement de foule débute :`,[`Fermer toutes les issues`,`Alerter le PC, réguler les flux, dégager les issues selon le plan`,`Se placer au centre`,`Quitter son poste`],1,`Agir tôt et selon le plan.`],[`La capacité maximale d'un ERP est atteinte à l'entrée :`,[`On laisse entrer`,`On stoppe l'entrée et on prévient le PC ou l'organisateur`,`On augmente le volume`,`On ferme les issues`],1,`Respect de la capacité d'accueil.`],[`Une personne en détresse dans la foule :`,[`On l'ignore`,`On la signale au PC et on protège la zone pour les secours`,`On la pousse`,`On la filme`],1,`Alerte et protection de la zone.`]],
[[`Un camion-citerne arrive à un site Seveso. Contrôle indispensable :`,[`Aucun`,`Identification du chauffeur et du véhicule, autorisation et consignes du site`,`Un signe de la main`,`Entrée libre si pressé`],1,`Contrôle d'accès rigoureux.`],[`Forte odeur chimique dans l'atelier. Vous :`,[`Entrez vérifier`,`N'entrez pas, alertez, éloignez le personnel et suivez le plan d'urgence`,`Ouvrez tout`,`Fumez`],1,`Pas d'exposition inutile.`],[`Le pictogramme flamme signale :`,[`Un produit inflammable`,`Un produit alimentaire`,`Un produit recyclable`,`Un produit radioactif`],0,`Flamme : inflammable.`]],
[[`Victime consciente avec une hémorragie abondante au bras. Ordre d'actions :`,[`Appeler et attendre`,`Protéger, comprimer la plaie, alerter le 15 ou le 112, surveiller`,`Poser un garrot sans raison`,`Faire boire`],1,`Protéger, comprimer, alerter.`],[`Un client veut entrer avec un gros sac et refuse l'inspection visuelle. Vous :`,[`Autorisez`,`Refusez poliment l'accès, expliquez la règle, rendez compte`,`Forcez`,`L'insultez`],1,`Accès conditionné au contrôle.`],[`Incendie, une personne est enfermée. Vous :`,[`Ouvrez sans précaution`,`Alertez le 18, donnez l'alarme, guidez sans prendre de risque inconsidéré`,`Quittez sans prévenir`,`Remplissez la main courante d'abord`],1,`Alerte, alarme, prudence.`]]
];
function grp(f){return G.map(g=>`<h2 style="margin:22px 0 4px;color:var(--ac)">${g.t} <span class="mu">· ${g.h}</span></h2>`+g.ids.map(f).join("")).join("")}
const $=s=>document.querySelector(s),sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
function sg(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}}
function ss(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let best=sg("cqp_best",{}),v="cours",Q=null;
const S=[
{t:`Cadre juridique et déontologie`,air:`Frère Jacques`,l:[`Livre Six du CSI, Livre Six du CSI,`,`C'est la loi, c'est la loi !`,`Carte pro du CNAPS, cinq ans de validité,`,`Renouvelée, renouvelée !`,`Pas de pouvoir de police, pas de tenue qui trompe,`,`Discret, neutre, respectueux : voilà l'agent honnête !`],tip:`CSI = Code de la sécurité intérieure ; la carte pro dure 5 ans.`},
{t:`Missions et pouvoirs de l'agent`,air:`Au clair de la lune`,l:[`Flagrant délit, article soixante-treize,`,`Tout citoyen peut agir, sans faire de tapage :`,`On appréhende, on appelle le dix-sept,`,`L'OPJ prend le relais, la justice est complète.`,`Fouille d'un sac ? Avec l'accord du propriétaire.`,`Palpation ? Même sexe, et consentement, c'est la loi.`,`Légitime défense : nécessaire, proportionnée,`,`Porter secours : deux-vingt-trois-six, jamais l'oublier !`],tip:`73 = flagrant délit (CPP) ; 223-6 = non-assistance (Code pénal) ; 122-5 = légitime défense.`},
{t:`Secourisme (SST)`,air:`Alouette, gentille alouette`,l:[`Protéger, examiner, alerter, secourir,`,`Quinze, dix-huit, cent douze, dix-sept à retenir !`,`Ça saigne ? On comprime !`,`Inconscient qui respire ? PLS !`,`Cœur à l'arrêt : cent à cent vingt par minute,`,`Et le défibrillateur, vite, on l'amène !`],tip:`15 SAMU, 18 pompiers, 17 police, 112 européen.`},
{t:`Prévention et risque d'incendie`,air:`Savez-vous planter les choux`,l:[`Combustible, comburant, énergie d'activation,`,`Le triangle du feu, voilà la leçon !`,`A les solides, B les liquides, C les gaz,`,`D les métaux, F la friteuse, qu'on n'arrose pas !`,`On donne l'alarme, on appelle le dix-huit,`,`Escalier, jamais l'ascenseur, et portes fermées en sortant !`],tip:`Jamais d'eau sur un feu électrique ni sur de l'huile enflammée.`},
{t:`Communication et gestion des conflits`,air:`Ah ! vous dirai-je, maman`,l:[`Voix posée, calme et claire,`,`Mains visibles, distance en terre,`,`Écoute active : on reformule,`,`Pas de ton qui s'emballe.`,`Rapport factuel : qui, quoi, quand, où, comment,`,`Force en dernier recours, toujours proportionnée.`],tip:`Un rapport = des faits, jamais des opinions.`},
{t:`Sensibilisation aux risques terroristes`,air:`Sur le pont d'Avignon`,l:[`Vigilance, sécurité renforcée,`,`Urgence attentat : trois niveaux à retenir !`,`Colis suspect ? On ne touche pas,`,`On écarte le public, on appelle le dix-sept.`,`S'échapper, se cacher, alerter,`,`Voilà les trois réflexes en cas d'attaque !`],tip:`Observer, signaler, protéger : l'agent n'est pas la police.`},
{t:`Armes et catégories`,air:`Alouette (version rythme libre)`,l:[`A comme Alerte : les armes de guerre,`,`B comme Besoin d'une autorisation,`,`C comme Courrier : on déclare,`,`D comme Disponible, mais pas partout !`,`Le port de l'agent : autorisation et formation,`,`Et toujours nécessité et proportion !`],tip:`A = guerre, B = autorisation, C = déclaration, D = libre acquisition (port encadré).`},
{t:`Gestion des conflits en situation`,air:`Une souris verte`,l:[`D'abord j'évalue, je regarde les issues,`,`Jamais seul si ça chauffe : la radio, le PC, le dix-sept !`,`DESC : je Décris, j'Exprime,`,`Je Suggère, je rappelle les Conséquences.`,`Alcool ? Phrases courtes, calme, pas de provocation,`,`Bagarre ? Renforts et secours, pas d'interposition !`],tip:`DESC = Décrire, Exprimer, Suggérer, Conséquences.`},
{t:`Droit du travail du salarié de la sécurité`,air:`Savez-vous planter les choux (bis)`,l:[`Trente-cinq heures par semaine, c'est la durée légale,`,`Dix heures par jour au max, quarante-huit au plafond,`,`Quarante-quatre en moyenne sur douze semaines,`,`Onze heures de repos entre deux services !`,`Vingt-quatre heures par semaine de repos en plus,`,`Vingt minutes de pause après six heures de travail,`,`Et danger grave et imminent : droit de retrait !`],tip:`11 h de repos quotidien ; 20 min de pause après 6 h.`},
{t:`Stratégique : métier et posture`,air:`Il pleut, il pleut, bergère`,l:[`Surveillance et gardiennage, voilà ma mission,`,`Contrat et consignes écrites guident mon action.`,`Tenue nette, vouvoiement, calme et ponctuel,`,`Je préviens, je dissuade, j'observe sans danger.`,`Main courante bien tenue, hiérarchie informée,`,`Et passation faite à l'équipe qui prend le relais !`],tip:`Prévenir, dissuader, détecter, alerter, rendre compte.`},
{t:`Modalités d'appréhension`,air:`Frère Jacques`,l:[`Flagrant délit, flagrant délit,`,`Article soixante-treize, article soixante-treize,`,`Force nécessaire, force proportionnée,`,`Puis l'OPJ, puis l'OPJ !`],tip:`Appréhender = flagrant délit + force proportionnée + remise à l'OPJ.`},
{t:`Module professionnel`,air:`Au clair de la lune`,l:[`Accueil, badge, ronde, main courante,`,`Les clés bien gardées, la radio qui chante,`,`Observer, alerter, rendre compte,`,`C'est ainsi que l'agent ne craint pas la honte !`],tip:`Observer, alerter, rendre compte.`},
{t:`Palpation et inspection des bagages`,air:`Alouette, gentille alouette`,l:[`Le sac : on regarde, on ne fouille qu'avec l'accord,`,`Palpation : même sexe, consentement obligatoire,`,`Un refus ? On refuse l'accès,`,`Jamais de force, jamais de geste déplacé !`],tip:`Visuelle = libre ; fouille et palpation = consentement.`},
{t:`Moyens électroniques de sécurité`,air:`Ah ! vous dirai-je, maman`,l:[`Caméras affichées, vie privée respectée,`,`Les images, confidentielles, bien gardées,`,`PC sécurité, alarmes à surveiller,`,`Levée de doute, on alerte et on note !`],tip:`Affichage, vie privée, confidentialité, levée de doute.`},
{t:`Gestion des risques`,air:`Savez-vous planter les choux`,l:[`Danger, risque, prévention, protection,`,`Identifier, évaluer, traiter, suivre l'action,`,`DUERP, document unique à tenir,`,`Plan de prévention pour les entreprises qui viennent !`],tip:`Prévention = probabilité ; protection = gravité.`},
{t:`Événementiel spécifique`,air:`Sur le pont d'Avignon`,l:[`Gérer les flux, éviter la foule en panique,`,`ERP, capacité à respecter,`,`Billets, bagages, palpation dans le cadre,`,`Évacuer calmement, guider vers les issues !`],tip:`Agir tôt vaut mieux que gérer la panique.`},
{t:`Industriel spécifique`,air:`Il pleut, il pleut, bergère`,l:[`ICPE, Seveso, sites à risque majeur,`,`EPI portés, consignes lues, respectées,`,`Pictogrammes connus, produit inconnu : on ne touche pas,`,`Permis de feu pour les points chauds !`],tip:`Consignes du site, EPI, pictogrammes, permis de feu.`},
{t:`Mise en situation pratique`,air:`Une souris verte`,l:[`J'observe, je me présente, je parle calmement,`,`J'agis dans la loi, je ne force pas sans raison,`,`J'alerte : quinze, dix-sept, dix-huit, cent douze,`,`Je rends compte, à l'oral puis à l'écrit !`],tip:`Observer, se présenter, agir dans la loi, alerter, rendre compte.`}
];
function chants(){return `<div class="card"><h2>🎵 Cours en chansons</h2><p class="mu">Chantez ou fredonnez les couplets à voix haute (rythme libre, à votre façon) : la rime aide la mémoire. Le cours classique et les QCM restent la référence.</p><div class="key"><b>Refrain du bon agent</b><br>Je regarde, j'écoute, je reste calme,<br>Je protège, j'alerte, je rends compte,<br>Agent de sécurité, jamais policier,<br>Respect de la loi, toujours mon métier !</div></div>`+grp(i=>{const s=S[i];return `<div class="card"><h2>${s.t}</h2><div class="mu">🎶 Sur l'air de : ${s.air}</div><div class="key">${s.l.join('<br>')}</div><p>💡 <b>Astuce :</b> ${s.tip}</p><div class="row"><button class="btn" onclick="go('cours')">📘 Voir le cours</button><button class="btn p" onclick="start(${i})">📝 Tester</button></div></div>`})}
const tabs=[["cours","📘 Cours"],["chants","🎵 Cours en chansons"],["qcm","📝 QCM"],["prog","📊 Progression"]];
function nav(){$("#nav").innerHTML=tabs.map(t=>`<button class="${v===t[0]?"on":""}" onclick="go('${t[0]}')">${t[1]}</button>`).join("")}
function go(x){v=x;Q=null;draw()}
function draw(){nav();let h="";
if(v==="cours")h=grp(i=>`<div class="card"><h2>${M[i].t}</h2>${M[i].c}<div class="row"><button class="btn p" onclick="start(${i})">S'entraîner sur ce module</button></div></div>`);
else if(v==="chants")h=chants();
else if(v==="qcm"&&!Q)h=`<div class="card"><h2>Choisir un QCM</h2><div class="row">${[1,2,3].map(n=>`<button class="btn ${lv===n?"p":""}" onclick="lv=${n};draw()">${[`Niveau 1 · Fondamentaux`,`Niveau 2 · Confirmé`,`Niveau 3 · Examen`][n-1]}</button>`).join("")}</div><p class="mu">${[`Réponses corrigées immédiatement.`,`Cas pratiques et pièges, corrigés immédiatement.`,`Conditions d'examen : questions des niveaux 1 et 2, correction à la fin.`][lv-1]}</p>`+grp(i=>`<button class="opt" onclick="start(${i})">${M[i].t} <span class="mu">(${nq(i)} questions${best[bkey(i)]!=null?" · meilleur : "+best[bkey(i)]+"%":""})</span></button>`)+`<button class="opt" onclick="start('x')"><b>Examen blanc</b> : ${lv===3?30:20} questions mélangées <span class="mu">${best[bkey(`x`)]!=null?"(meilleur : "+best[bkey(`x`)]+"%)":""}</span></button></div>`;
else if(v==="qcm")h=quiz();
else h=`<div class="card"><h2>Progression</h2>`+grp(i=>`<div>${M[i].t} <span class="mu">N1 ${bs(i)} · N2 ${bs(i+`@2`)} · N3 ${bs(i+`@3`)}</span><div class="bar"><i style="width:${Math.max(best[i]||0,best[i+`@2`]||0,best[i+`@3`]||0)}%"></i></div></div>`)+`<div>Examen blanc <span class="mu">N1 ${bs(`x`)} · N2 ${bs(`x@2`)} · N3 ${bs(`x@3`)}</span><div class="bar"><i style="width:${Math.max(best.x||0,best[`x@2`]||0,best[`x@3`]||0)}%"></i></div></div><div class="row"><button class="btn" onclick="best={};ss('cqp_best',best);draw()">Réinitialiser</button></div></div>`;
$("#app").innerHTML=h;window.scrollTo(0,0)}
function start(k){let p=[];(k==="x"?M.map((m,i)=>i):[k]).forEach(i=>{(lv===1?M[i].q:lv===2?H[i]:M[i].q.concat(H[i])).forEach(q=>p.push(q))});
p=sh(p);if(k==="x")p=p.slice(0,lv===3?30:20);
Q={k,bk:bkey(k),ex:lv===3,i:0,s:0,pick:null,err:[],l:p.map(q=>({q:q[0],o:sh(q[1].map((t,j)=>({t,ok:j===q[2]}))),e:q[3]}))};v="qcm";draw()}
function quiz(){const t=Q.l.length;
if(Q.i>=t){const pc=Math.round(Q.s*100/t);if(best[Q.bk]==null||pc>best[Q.bk]){best[Q.bk]=pc;ss("cqp_best",best)}
return `<div class="card"><h2>Résultat</h2><div class="big">${Q.s}/${t}</div><p>${pc>=70?"✅ Bravo, objectif de 70 % atteint.":"À retravailler : relisez le cours puis recommencez."}</p>${Q.err.length?"<h3>À revoir</h3>"+Q.err.map(e=>`<div class="key"><b>${e.q}</b><br>✅ ${e.r}<br><span class="mu">${e.e}</span></div>`).join(""):""}<div class="row"><button class="btn p" onclick="start(Q.k)">Recommencer</button><button class="btn" onclick="go('qcm')">Autres QCM</button><button class="btn" onclick="go('cours')">Revoir le cours</button></div></div>`}
const c=Q.l[Q.i];
return `<div class="card"><div class="mu">Question ${Q.i+1}/${t} · ${Q.ex?`conditions d'examen`:`score `+Q.s}</div><div class="bar"><i style="width:${Q.i*100/t}%"></i></div><h2>${c.q}</h2>`+c.o.map((o,j)=>`<button class="opt ${Q.pick!=null?(o.ok?"ok":(j===Q.pick?"ko":"")):""}" ${Q.pick!=null?"disabled":""} onclick="pick(${j})">${o.t}</button>`).join("")+(Q.pick!=null?`<div class="key">${c.o[Q.pick].ok?"✅ Bonne réponse.":"❌ Mauvaise réponse."} ${c.e}</div><div class="row"><button class="btn p" onclick="nx()">${Q.i+1<t?"Question suivante":"Voir le résultat"}</button></div>`:"")+`</div>`}
function pick(j){if(Q.pick!=null)return;const c=Q.l[Q.i];if(c.o[j].ok)Q.s++;else Q.err.push({q:c.q,r:c.o.find(o=>o.ok).t,e:c.e});if(Q.ex){Q.i++;draw();return}Q.pick=j;draw()}
function nx(){Q.i++;Q.pick=null;draw()}
draw();
</script>
